name: portfolio-development

services:
    website:
        container_name: portfolio-website-development

        build:
            context: .

            dockerfile: Dockerfile

            target: development

        environment:
            - HOSTNAME=${HOSTNAME}
            - PORT=${PORT}

        ports:
            - ${PORT}:3000

        volumes:
            - .:/app
            - /app/node_modules
            - /app/.next

        restart: unless-stopped
